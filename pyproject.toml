[project]
name = "mission-control"
version = "0.1.0"
description = "A terminal mission control for multi-agent pipelines: watch every step, tool call and plugin live."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=8"]

[project.urls]
Repository = "https://github.com/Ashwani1330/mission-control"

[project.scripts]
mission-control = "mission_control.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
